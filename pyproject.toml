# ============================================================================
# Projeto Python da stack RAG (ingest/ eval/ mcpsrv/). Fonte de verdade para o
# LOCKFILE (`uv.lock`) usado pela CI (S27 / T-ENV-5). requirements.txt continua
# como doc legível das versões; pyproject é a forma que o uv congela.
# Python 3.12, sem framework de RAG (decisão travada no PLANO-RAG §3).
# ============================================================================

[project]
name = "ecollm-rag"
version = "0.0.0"
description = "RAG de código+docs (pgvector + LiteLLM) do ecollm-stack"
requires-python = ">=3.12,<3.13"
dependencies = [
    "tree-sitter==0.26.0",
    "tree-sitter-python==0.25.0",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-go==0.25.0",
    "tree-sitter-bash==0.25.1",
    "pyyaml>=6",
    "requests>=2.31",          # embed.py fala com LiteLLM via HTTP
    "psycopg[binary]>=3.2",    # store.py (FASE 2)
    "mcp>=2.2,<3",             # FASE 5: servidor MCP rag_search (stdio), API 2.x
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

# Projeto "virtual": não empacotamos nem instalamos nosso próprio código — só
# queremos o grafo de dependências travado em uv.lock. `package = false` evita o
# uv tentar construir uma wheel (não há módulo ecollm_rag). A CI roda `uv sync`
# para trazer as deps e executa pytest por caminho.
[tool.uv]
package = false

[tool.pytest.ini_options]
# rootdir do repo; testes vivem em */tests. addopts mantém saída enxuta.
testpaths = ["ingest/tests", "eval/tests", "mcpsrv/tests"]
addopts = "-q"

# S31-c · piso de cobertura TRAVADO. Nao colocamos --cov em addopts para nao
# acoplar o fluxo de teste padrao ao pytest-cov (roda-se o suite sem plugin).
# O gate de cobertura e opt-in via comando abaixo (CI/closeout).
#   .venv/bin/python -m pytest --cov=ingest --cov=eval --cov=mcpsrv
[tool.coverage.run]
source = ["ingest", "eval", "mcpsrv"]
# S66: mede RAMOS (branch), nao so linhas. Um `except`/`else` defensivo que nunca
# dispara deixa de contar como coberto. Medido 2026-10-15: linha 96,00% -> branch
# 94,46% (delta ~1,5pt; os maiores gaps sao cli.py 68% e chunker.py 85%, ramos de
# borda/DB). O piso abaixo reflete o branch real com folga p/ ruido defensivo.
branch = true

[tool.coverage.report]
# Piso automatizado (S31; re-baselinado p/ branch em S66): a execucao com --cov
# falha se cair abaixo disto. Valor = round-down do branch medido (94,46%) com
# ~0,5pt de folga. NAO inflar testes artificiais p/ subir o piso — cobrir ramo
# real ou aceitar o gap documentado.
fail_under = 94
show_missing = true
precision = 2


[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
