services:
  ollama:
    image: ollama/ollama:latest
    container_name: ai-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama/entrypoint.sh:/entrypoint.sh
    entrypoint: [ "/bin/bash", "/entrypoint.sh" ]
    environment:
      - OLLAMA_DEBUG=1
      # Ollama is the fallback path: keep models warm for a bounded window
      # instead of pinning them to VRAM forever (-1). Reloads on demand after idle.
      - OLLAMA_KEEP_ALIVE=15m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  # Credenciais lidas do .env (ver .env.example). Defaults = DEV LOCAL apenas.
  litellm-db:
    image: postgres:15
    container_name: ai-litellm-db
    environment:
      - POSTGRES_USER=${LITELLM_DB_USER:-litellm}
      - POSTGRES_PASSWORD=${LITELLM_DB_PASSWORD:-litellm_secret}
      - POSTGRES_DB=${LITELLM_DB_NAME:-litellm}
    volumes:
      - litellm_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  litellm-redis:
    image: redis:7-alpine
    container_name: ai-litellm-redis
    command: redis-server --save 20 1 --loglevel warning
    volumes:
      - litellm_redis_data:/data
    restart: unless-stopped

  # ===== BANCO DO RAG (pgvector) — FASE 0 do .planning/PLANO-RAG.md =====
  # Rede interna em rag-db:5432 para os containers da stack. Publica TAMBEM
  # 127.0.0.1:5433 no host (bind loopback apenas, nada exposto a rede externa)
  # para o CLI de ingest (FASE 2) rodar fora do docker sem entrar na rede.
  # init.sql roda UMA vez no primeiro bootstrap do volume (docker-entrypoint-initdb.d).
  # Imagem pg17 = linha moderna do Postgres com extensao vector pre-compilada.
  rag-db:
    image: pgvector/pgvector:pg17
    container_name: ai-rag-db
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_USER=${RAG_DB_USER:-rag}
      - POSTGRES_PASSWORD=${RAG_DB_PASSWORD:-rag_secret}
      - POSTGRES_DB=${RAG_DB_NAME:-rag}
    volumes:
      - rag_db_data:/var/lib/postgresql/data
      - ./rag-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # S11 (T-OPS-1): o entrypoint do Postgres roda init.sql SEM ON_ERROR_STOP
    # garantido e só na 1a criação do volume, então um statement inválido no meio
    # pode deixar o container "up" com schema INCOMPLETO (ex.: sem o índice HNSW).
    # Este healthcheck confere a estrutura real (tabela + 3 índices obrigatórios
    # válidos) e marca o serviço como unhealthy se divergir — nunca "ready" c/ schema
    # quebrado. Checagem completa (halfvec 3072, opclass halfvec_cosine_ops, tsv
    # gerada) vive em rag-db/verify_schema.py; rode-o após mexer em init.sql.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          psql -U "$${POSTGRES_USER:-rag}" -d "$${POSTGRES_DB:-rag}" -tA -c "SELECT CASE WHEN to_regclass('chunks') IS NOT NULL AND (SELECT count(*) FROM (VALUES ('chunks_embedding_hnsw','hnsw'), ('chunks_tsv_gin','gin'),('chunks_repo_path_content_hash_key','btree')) need(name,am) JOIN pg_index i ON i.indrelid='chunks'::regclass JOIN pg_class c ON c.oid=i.indexrelid JOIN pg_am a ON a.oid=c.relam WHERE c.relname=need.name AND a.amname=need.am AND i.indisvalid)=3 THEN 'ok' ELSE 'schema-incompleto' END;" | grep -q '^ok$$'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  litellm:
    # NOTE: the bare `:main` tag is a stale Dec-2023 build whose ENTRYPOINT hardcodes
    # `litellm --config /app/proxy_server_config.yaml` and ignores CMD, so our config.yaml
    # was never read and the image's built-in Azure demo model_list crashed on startup.
    image: ghcr.io/berriai/litellm:main-stable
    container_name: ai-litellm
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://${LITELLM_DB_USER:-litellm}:${LITELLM_DB_PASSWORD:-litellm_secret}@litellm-db:5432/${LITELLM_DB_NAME:-litellm}
      - REDIS_URL=redis://litellm-redis:6379
      # Sem default: falha-closed se .env não definir a chave (S17 removeu o
      # valor real hardcoded; antes caía em sk padrão conhecido publicamente).
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY ausente no .env}
      - LITELLM_LOG=DEBUG
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - QWEN_PLAN_API_KEY=${QWEN_PLAN_API_KEY}
      # URL do banco do RAG vista pelo CONTAINER (rede interna, host=rag-db).
      # O CLI de ingest no HOST usa RAG_DB_URL (localhost:5433) do mesmo .env.
      - RAG_DB_URL=${RAG_DB_URL_INTERNAL:-postgresql://rag:rag_secret@rag-db:5432/rag}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: [ "--config", "/app/config.yaml", "--port", "4000" ]
    depends_on:
      - ollama
      - litellm-db
      - litellm-redis
      - rag-db
    restart: unless-stopped

volumes:
  ollama_data:
  litellm_db_data:
  litellm_redis_data:
  rag_db_data:
