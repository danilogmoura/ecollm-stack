model_list:
  # ===== CHAT (ask do RAG) =====
  # Primário: Gemini free tier. Pin fixo (3.8-flash) em vez do alias rolante
  # "-latest", que muda de versão sem você controlar.
  - model_name: rag-chat
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY

  # Fallback: Ollama local — qwen3:4b-instruct-2507 (2,5 GB, ctx 256K).
  # Trocou qwen2.5-coder:7b em 2026-09-25: não existe coder dedicado novo que caiba
  # em 8 GB (qwen3-coder:30b = 19 GB). O 4B é mais novo, cabe com folga e carrega
  # sob demanda em ~2-3 s. SEM warmup por decisão: GPU livre em repouso, o modelo
  # só sobe se o fallback realmente disparar (papel de emergência).
  # Tag real no registry exige o sufixo de quantização (-q4_K_M).
  - model_name: qwen3:4b-instruct-2507
    litellm_params:
      model: ollama_chat/qwen3:4b-instruct-2507-q4_K_M
      api_base: http://ai-ollama:11434

  # ===== AGENTE (Roo Code — Modes/plan). NAO entra no rag-chat nem no RAG. =====
  # Token Plan Individual QwenCloud. Regras do plano (doc 2026-09-25):
  #  - chave comeca com "sk-sp-" e so funciona no base URL do plano (nao misturar
  #    com chave comum sk-ws-);
  #  - endpoint OpenAI-compat usado pelo LiteLLM = /compatible-mode/v1;
  #  - ferramentas Harness (web search etc.) so via Responses API — pelo chat
  #    completions o modelo responde normal, sem as ferramentas automaticas.
  # No Roo Code: provider "OpenAI Compatible", base http://localhost:4000/v1,
  # api key = LITELLM_MASTER_KEY.
  #
  # ---- POR QUE EXISTEM VERSOES "-fast" (thinking OFF) E SEM SUFIXO (ON) ----
  # Modelos de raciocinio pagam thinking em token + latencia (matriz medida
  # 2026-09-25 neste proxy: flash ON 2467 out-tok/59s vs OFF 286/6,6s; max OFF
  # chegou a ser MAIS completo que ON). 3 armadilhas motivaram o par ON/OFF:
  #  1. thinking ON + tool_choice "required"/"none" => HTTP 400 no endpoint;
  #  2. em loop de agente, ON re-chamava a ferramenta em vez de sintetizar;
  #  3. ON injeta scaffolding no prompt (121 vs 85 in-tok medidos).
  # Regra: Code/Ask/Debug -> "-fast"; Architect/dificil -> sem sufixo.
  # Unica alavanca que desliga thinking: enable_thinking:false no PROXY
  # ("/no_think" no prompt e "thinking_budget:0" NAO funcionam — medidos).

  # --- Thinking ON: planejamento, arquitetura, debug dificil ---
  # Preco custom (C1/C2, 2026-09-27): marketplace PAYG, USD por token (= USD/1M / 1e6).
  # S30 RESOLVIDA (decisao do usuario): como NAO ha tarifa por Credito exposta pelo
  # Token Plan, estas tarifas PAYG da Qwen sao o PRECO CANONICO de custo-equivalente.
  # O `$` do SpendLogs (= tokens reais x esta tarifa) passa a ser o numero OFICIAL de
  # custo. Limitacao documentada: reflete so o trafego que passa pelo proxy; uso fora
  # do LiteLLM nao entra. Baseline de ganho segue sendo % hit em tokens (C6/C7).
  # Tarifas por MODELO (páginas oficiais qwencloud.com/models/<id>.md, conferidas
  # 2026-11-12; USD/1M ÷ 1e6). NAO sao intercambiaveis entre familias:
  #   flash: in $0,15/M out $0,47/M | cache read $0,016/M | cache write $0,20/M
  #   max:   in $2,00/M  out $6,00/M | cache read $0,17/M | cache write $2,50/M
  #   deepseek-v4.1-flash (no Token Plan): in $0,15/M out $0,60/M | cache read
  #   implicito $0,015/M (off-peak; peak = 2x) — pagina propria, conferir 2026-11-12
  # Contexto (mesma fonte, seção Rate Limits & Context): flash e max = ctx 1M,
  # Max Input 991K / Max Output 131K -> model_info abaixo (LiteLLM corta a
  # requisicao em max_input_tokens ANTES de enviar; sem ele, modelo desconhecido
  # assume default conservador e rejeita prompts longos legitimos).
  # OBS: "qwen4-max-preview" confirmado ao vivo 2026-11-12 (GET /v1/models;
  # responde como "qwen4.0-max-preview"). Sem pagina oficial (preview sem preco
  # publicado) — tarifas abaixo = familia max (qwen3.8-max.md), provisorias.
  - model_name: qwen4-max-preview
    litellm_params:
      model: openai/qwen4-max-preview
      api_base: https://token-plan.maas.qwencloudapi.com/compatible-mode/v1
      api_key: os.environ/QWEN_PLAN_API_KEY
      input_cost_per_token: 2.0e-06
      output_cost_per_token: 6.0e-06
      cache_read_input_token_cost: 1.7e-07
      cache_creation_input_token_cost: 2.5e-06
    model_info:
      max_input_tokens: 991000
      max_output_tokens: 131000

  - model_name: qwen4-max-preview-fast
    litellm_params:
      model: openai/qwen4-max-preview
      api_base: https://token-plan.maas.qwencloudapi.com/compatible-mode/v1
      api_key: os.environ/QWEN_PLAN_API_KEY
      enable_thinking: false
      input_cost_per_token: 2.0e-06
      output_cost_per_token: 6.0e-06
      cache_read_input_token_cost: 1.7e-07
      cache_creation_input_token_cost: 2.5e-06
    model_info:
      max_input_tokens: 991000
      max_output_tokens: 131000

  - model_name: qwen3.8-flash
    litellm_params:
      model: openai/qwen3.8-flash
      api_base: https://token-plan.maas.qwencloudapi.com/compatible-mode/v1
      api_key: os.environ/QWEN_PLAN_API_KEY
      input_cost_per_token: 1.5e-07
      output_cost_per_token: 4.7e-07
      cache_read_input_token_cost: 1.6e-08
      cache_creation_input_token_cost: 2.0e-07
    model_info:
      max_input_tokens: 991000
      max_output_tokens: 131000

  # --- Thinking OFF: loop de agente (Code/Ask). Motivos: ver bloco acima ---
  - model_name: qwen3.8-flash-fast
    litellm_params:
      model: openai/qwen3.8-flash
      api_base: https://token-plan.maas.qwencloudapi.com/compatible-mode/v1
      api_key: os.environ/QWEN_PLAN_API_KEY
      enable_thinking: false
      input_cost_per_token: 1.5e-07
      output_cost_per_token: 4.7e-07
      cache_read_input_token_cost: 1.6e-08
      cache_creation_input_token_cost: 2.0e-07
    model_info:
      max_input_tokens: 991000
      max_output_tokens: 131000

  # --- 2026-11-12: substitui qwen3.7-flash{,-fast} (id INEXISTENTE no Token
  # Plan — GET /v1/models nao lista; rotas morreriam em runtime). Este aqui
  # existe e foi testado ao vivo (thinking ON default). Preco oficial
  # (qwencloud.com/models/deepseek-v4.1-flash.md): off-peak in $0,15/M out
  # $0,60/M cache-impl $0,015/M; PEAK = 2x. ctx 1M in / 393K out.
  # Sem surcharge de cache-write => cache_creation omitido de proposito.
  - model_name: deepseek-v4.1-flash
    litellm_params:
      model: openai/deepseek-v4.1-flash
      api_base: https://token-plan.maas.qwencloudapi.com/compatible-mode/v1
      api_key: os.environ/QWEN_PLAN_API_KEY
      input_cost_per_token: 1.5e-07
      output_cost_per_token: 6.0e-07
      cache_read_input_token_cost: 1.5e-08
    model_info:
      max_input_tokens: 1000000
      max_output_tokens: 393000

  # --- Thinking OFF: mesma rota, enable_thinking:false (unica alavanca que
  # funciona no Token Plan; ver bloco de design no topo da secao Qwen) ---
  - model_name: deepseek-v4.1-flash-fast
    litellm_params:
      model: openai/deepseek-v4.1-flash
      api_base: https://token-plan.maas.qwencloudapi.com/compatible-mode/v1
      api_key: os.environ/QWEN_PLAN_API_KEY
      enable_thinking: false
      input_cost_per_token: 1.5e-07
      output_cost_per_token: 6.0e-07
      cache_read_input_token_cost: 1.5e-08
    model_info:
      max_input_tokens: 1000000
      max_output_tokens: 393000

  # --- Thinking OFF do qwen3.8-max (rota ON = "qwen4-max-preview", mesmo
  # upstream com preco da familia max) ---
  - model_name: qwen3.8-max-fast
    litellm_params:
      model: openai/qwen3.8-max
      api_base: https://token-plan.maas.qwencloudapi.com/compatible-mode/v1
      api_key: os.environ/QWEN_PLAN_API_KEY
      enable_thinking: false
      input_cost_per_token: 2.0e-06
      output_cost_per_token: 6.0e-06
      cache_read_input_token_cost: 1.7e-07
      cache_creation_input_token_cost: 2.5e-06
    model_info:
      max_input_tokens: 991000
      max_output_tokens: 131000

  # ===== DEEPSEEK DIRETO (rotas opcionais — fora do RAG; S55, 2026-10-14) =====
  # 4 grupos: flash + pro x thinking ON/OFF. Chave DEEPSEEK_API_KEY (conta
  # separada; sem ela, falham-closed sem afetar ninguem). Alias legados
  # deepseek-chat/-reasoner estao em aposentacao: NAO usar.
  # Upstream (confirmado em GET /v1/models + docs 2026-10-14):
  #   deepseek-flash  = V4.1-Flash   | ctx 1M | out 393K | visao OK
  #   deepseek-v4-pro = V4-Pro-0813  | ctx 1M | out 393K | SEM visao
  # GOTCHA de implementacao: aqui `thinking` vai TOP-LEVEL no litellm_params
  # (nao em extra_body): so assim o LiteLLM arma o shim
  # _fill_reasoning_content(); sem ele, multi-turno com tools da HTTP 400
  # ("reasoning_content must be passed back"). Em thinking ON, temp/top_p sao
  # inertes e completion inclui raciocinio.
  # Tarifas oficiais OFF-PEAK (peak = 2x: SpendLogs sub-notifica na janela de
  # peak; nunca sobre-notifica). Sem surcharge de cache-write => cache_creation
  # == input. flash: hit $0,003 | miss $0,15 | out $0,60 (/1M).
  #        pro:   hit $0,022 | miss $0,66 | out $1,98 (/1M).
  # Concorrencia: flash 2500 / pro 500 (erro 3003 no excesso). Rotas -fast para
  # agentes com tools; ON para chamada unica.
  - model_name: deepseek-flash
    litellm_params:
      model: deepseek/deepseek-flash
      api_key: os.environ/DEEPSEEK_API_KEY
      thinking:
        type: enabled
      input_cost_per_token: 1.5e-07
      output_cost_per_token: 6.0e-07
      cache_read_input_token_cost: 3.0e-09
      cache_creation_input_token_cost: 1.5e-07
    model_info:
      max_input_tokens: 1048576
  - model_name: deepseek-flash-fast
    litellm_params:
      model: deepseek/deepseek-flash
      api_key: os.environ/DEEPSEEK_API_KEY
      thinking:
        type: disabled
      input_cost_per_token: 1.5e-07
      output_cost_per_token: 6.0e-07
      cache_read_input_token_cost: 3.0e-09
      cache_creation_input_token_cost: 1.5e-07
    model_info:
      max_input_tokens: 1048576

  - model_name: deepseek-v4-pro
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_API_KEY
      thinking:
        type: enabled
      input_cost_per_token: 6.6e-07
      output_cost_per_token: 1.98e-06
      cache_read_input_token_cost: 2.2e-08
      cache_creation_input_token_cost: 6.6e-07
    model_info:
      max_input_tokens: 1048576
  - model_name: deepseek-v4-pro-fast
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_API_KEY
      thinking:
        type: disabled
      input_cost_per_token: 6.6e-07
      output_cost_per_token: 1.98e-06
      cache_read_input_token_cost: 2.2e-08
      cache_creation_input_token_cost: 6.6e-07
    model_info:
      max_input_tokens: 1048576

  # ===== EMBEDDINGS =====
  # gemini-embedding-2 = 3072 dims (MRL: aceita 768/1536/3072 via "dimensions";
  # auto-normaliza as dims truncadas — verificado no teste A/B 2026-09-24).
  # Task assimétrica p/ código: prefixo no texto "task: code retrieval | query: ..."
  # Embedding local (bge-m3) REMOVIDO da stack em 2026-09-25: sem fallback de
  # embeddings por design (3072 vs 1024 = espaços incompatíveis corromperiam o índice).
  #
  # GARANTIA (verificado 2026-09-25): o Google e SO o gerador de embeddings desta
  # stack. Os grupos qwen3.8-* sao chat-only — o proprio endpoint do Token Plan
  # retorna 404 em /v1/embeddings (erro do upstream, nao do LiteLLM), e a doc do
  # plano nao lista nenhum modelo de embedding. Um request de embed apontando p/
  # Qwen falha na porta, nao existe caminho silencioso p/ outro gerador. Se um dia
  # houver embedder novo, re-embedar o indice INTEIRO e obrigatorio (espacos
  # vetoriais de modelos diferentes sao incompativeis — nunca misturar no mesmo indice).
  - model_name: rag-embeddings
    litellm_params:
      model: gemini/gemini-embedding-2
      api_key: os.environ/GEMINI_API_KEY

  # ===== PERFIS DE EMBEDDING TROCAVEIS (S32-c, I9) =====
  # DECISAO (invariante 7): perfis de embedding NAO sao fallback. Cada grupo serve
  # um ESPACO VETORIAL proprio (tabela + dim no registry ingest/profiles.py); nunca
  # ha `fallbacks:` entre eles — misturar vetores de modelos diferentes num mesmo
  # indice corrompe a busca (BUG-002/§2 do plano). Trocar de perfil = sync dedicado
  # (`rag-sync --profile X`) que re-embeda o indice INTEIRO naquela tabela; o
  # ponteiro published_profile por repo decide qual espaco atende leitura (S32-b).
  #
  # qwen3.7-text-embedding (MaaS sk-ws-, 1024d, batch<=20): MELHOR candidato global
  # medido (overall r@8 0,949 no dataset-v2). O Token Plan (sk-sp-) NAO serve
  # embeddings (404) — so este endpoint MaaS /compatible-mode/v1. Chave em
  # QWEN_MAAS_API_KEY (.env, NUNCA commitada — ver R5: rotacionar antes de gravar).
  - model_name: rag-embeddings-qwen37
    litellm_params:
      model: openai/qwen3.7-text-embedding
      api_base: https://maas.qwencloudapi.com/compatible-mode/v1
      api_key: os.environ/QWEN_MAAS_API_KEY

  # bge-m3 (Ollama local, 1024d, $0/offline): melhor MRR entre os locais, forte em
  # pt-BR. Perfil de ingest/eval — nao precisa ficar quente (KEEP_ALIVE=15m evicta).
  # api_base usa o NOME DO SERVICO na rede docker ("ollama"), nao localhost (R8).
  - model_name: rag-embeddings-bgem3
    litellm_params:
      model: openai/bge-m3:latest
      api_base: http://ollama:11434/v1
      api_key: ollama

litellm_settings:
  drop_params: true
  # S28 (T-OPS-5): verbose desligado por default. Com set_verbose:true +
  # LITELLM_LOG=DEBUG o proxy despejava o CORPO inteiro de cada request nos logs
  # — incluindo a master key e todo o payload do agente. DEBUG só sob demanda.
  set_verbose: false
  num_retries: 2
  # Cada item: {modelo_chamado: [fallbacks em ordem]}
  # Chat: Gemini -> qwen3:4b local (válido, mesma tarefa).
  # Embeddings: sem fallback por design — não existe embedder local na stack.
  fallbacks:
    - rag-chat: ["qwen3:4b-instruct-2507"]

  # ===== CACHE (Redis via REDIS_URL) =====
  # Habilitado SO p/ embeddings (motivo medido): re-ingest do mesmo corpus vira
  # hit gratis; chat fica FORA de proposito (loop de agente muda os messages a
  # cada iteracao => hit ~zero + latencia Redis). Cache semantico: fora (doc
  # LiteLLM: falha em trafego agentic). Context caching do UPSTREAM e outra
  # camada (Token Plan suporta em rota openai-compat — BUG-007 medido; ver
  # PLANO-RAG.md §4b). Economia de entrada a seguir = headroom de janela, nao
  # cache de resposta.
  cache: true
  cache_params:
    type: redis # lê conexão de REDIS_URL (env), sem host/port explícitos
    # S74: só `aembedding`. `atranscription` foi REMOVIDO — não há nenhum modelo de
    # áudio/transcrição na stack (config morta). Chat fica FORA de propósito (loop de
    # agente ⇒ hit ~zero, só adds latência Redis).
    supported_call_types: ["aembedding"]
    ttl: 86400 # respostas de embed válidas p/ re-ingest no mesmo dia

# ===== S112 — ROUTER SETTINGS (cooldown / allowed_fails) =====
# Incidente 2026-10-16 (reports/2026-10-16-copilot-chat-500-429.md): grupo de 1
# deployment + cooldown por 429 => "all_deployments_in_cooldown" imediato.
# Escolha: limiar maior e cooldown mais curto, mecanismo LIGADO (protege contra
# upstream realmente fora; disable_cooldowns:true mascararia 429 real).
#   allowed_fails: 5 (default 3) | cooldown_time: 15s (default 5s gerava rajada)
# num_retries: 2 (litellm_settings) segue valendo = 3 tentativas totais.
router_settings:
  allowed_fails: 5
  cooldown_time: 15
  disable_cooldowns: false

