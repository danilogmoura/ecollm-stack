model_list:
  # ===== CHAT (ask do RAG) =====
  # Primário: Gemini free tier. Pin fixo (3.8-flash) em vez do alias rolante
  # "-latest", que muda de versão sem você controlar.
  - model_name: rag-chat
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY

  # Fallback: Ollama local — qwen3:4b-instruct-2507 (2,5 GB, ctx 256K).
  # Trocou qwen2.5-coder:7b em 2026-09-25: não existe coder dedicado novo que caiba
  # em 8 GB (qwen3-coder:30b = 19 GB). O 4B é mais novo, cabe com folga e carrega
  # sob demanda em ~2-3 s. SEM warmup por decisão: GPU livre em repouso, o modelo
  # só sobe se o fallback realmente disparar (papel de emergência).
  # Tag real no registry exige o sufixo de quantização (-q4_K_M).
  - model_name: qwen3:4b-instruct-2507
    litellm_params:
      model: ollama_chat/qwen3:4b-instruct-2507-q4_K_M
      api_base: http://ai-ollama:11434

  # ===== AGENTE (Roo Code — Modes/plan). NAO entra no rag-chat nem no RAG. =====
  # Token Plan Individual QwenCloud. Regras do plano (doc 2026-09-25):
  #  - chave comeca com "sk-sp-" e so funciona no base URL do plano (nao misturar
  #    com chave comum sk-ws-);
  #  - endpoint OpenAI-compat usado pelo LiteLLM = /compatible-mode/v1;
  #  - ferramentas Harness (web search etc.) so via Responses API — pelo chat
  #    completions o modelo responde normal, sem as ferramentas automaticas.
  # No Roo Code: provider "OpenAI Compatible", base http://localhost:4000/v1,
  # api key = LITELLM_MASTER_KEY.
  #
  # ---- POR QUE EXISTEM VERSOES "-fast" (thinking OFF) E SEM SUFIXO (ON) ----
  # qwen3.8-* sao modelos de raciocinio: pensam em "reasoning_content" antes de
  # responder, e isso e pago em token + latencia. Matriz medida 2026-09-25 via
  # este proxy (tarefa dificil = revisar funcao p/ race conditions):
  #   flash ON : 2467 out-tok (2110 reasoning!) | 59,2 s | 11 itens achados
  #   flash OFF:  286 out-tok                   |  6,6 s |  6 itens
  #   max   ON :  538 out-tok (183 reasoning)   | 15,9 s | 11 itens
  #   max   OFF:  468 out-tok                   |  9,7 s | 12 itens (mais completo!)
  # Mais 3 achados que decidiram o design:
  #  1. ARMADILHA 400: com thinking ON, tool_choice "required"/"none" retorna
  #     HTTP 400 no endpoint. Clientes que forcam tool_choice (alguns modos do
  #     Roo) quebrariam nos grupos sem sufixo. Com OFF, funciona.
  #  2. LOOP DE AGENTE: no multi-turn (resultado de ferramenta de volta), ON
  #     re-chamou a ferramenta em vez de sintetizar (finish=tool_calls, 122 tok);
  #     OFF respondeu certo (finish=stop, 10 tok). Thinking ON deixa o modelo
  #     MAIS propenso a emendar chamada de ferramenta — num loop de 20-50
  #     iteracoes por tarefa, isso multiplica custo/latencia com risco de loop.
  #  3. Thinking ON infla ate o PROMPT (121 vs 85 in-tok = scaffolding injetado),
  #     e o prompt de agente carrega o historico inteiro a cada iteracao.
  # Regra de uso no Roo Code (mapear por mode nos presets):
  #   Code/Ask/Debug-mecanico -> "-fast" (procedural, contexto ja na tela)
  #   Architect/plantia/difficil -> sem sufixo (encadear passos = onde thinking
  #   mostra servico: no unico caso em que ON ganhou, achou 11 vs 6 itens)
  # OBS: "/no_think" no prompt NAO desliga nada (423 reasoning-tok medidos);
  #      "thinking_budget:0" da erro (endpoint exige positivo). A unica alavanca
  #      que funciona e enable_thinking:false — por isso fixamos NO PROXY, e nao
  #      dependendo de config do cliente.

  # --- Thinking ON: planejamento, arquitetura, debug dificil ---
  # Preco custom (C1/C2, 2026-09-27): marketplace PAYG, USD por token (= USD/1M / 1e6).
  # S30 RESOLVIDA (decisao do usuario): como NAO ha tarifa por Credito exposta pelo
  # Token Plan, estas tarifas PAYG da Qwen sao o PRECO CANONICO de custo-equivalente.
  # O `$` do SpendLogs (= tokens reais x esta tarifa) passa a ser o numero OFICIAL de
  # custo. Limitacao documentada: reflete so o trafego que passa pelo proxy; uso fora
  # do LiteLLM nao entra. Baseline de ganho segue sendo % hit em tokens (C6/C7).
  #   flash: in $0,15/M out $0,47/M | cache read $0,016/M | cache write $0,20/M
  #   max:   in $2,00/M  out $6,00/M | cache read $0,17/M | cache write $2,50/M
  - model_name: qwen3.8-max
    litellm_params:
      model: openai/qwen3.8-max
      api_base: https://token-plan.maas.qwencloudapi.com/compatible-mode/v1
      api_key: os.environ/QWEN_PLAN_API_KEY
      input_cost_per_token: 2.0e-06
      output_cost_per_token: 6.0e-06
      cache_read_input_token_cost: 1.7e-07
      cache_creation_input_token_cost: 2.5e-06

  - model_name: qwen3.8-flash
    litellm_params:
      model: openai/qwen3.8-flash
      api_base: https://token-plan.maas.qwencloudapi.com/compatible-mode/v1
      api_key: os.environ/QWEN_PLAN_API_KEY
      input_cost_per_token: 1.5e-07
      output_cost_per_token: 4.7e-07
      cache_read_input_token_cost: 1.6e-08
      cache_creation_input_token_cost: 2.0e-07

  # --- Thinking OFF: loop de agente (Code/Ask). Motivos: ver bloco acima ---
  - model_name: qwen3.8-flash-fast
    litellm_params:
      model: openai/qwen3.8-flash
      api_base: https://token-plan.maas.qwencloudapi.com/compatible-mode/v1
      api_key: os.environ/QWEN_PLAN_API_KEY
      enable_thinking: false
      input_cost_per_token: 1.5e-07
      output_cost_per_token: 4.7e-07
      cache_read_input_token_cost: 1.6e-08
      cache_creation_input_token_cost: 2.0e-07

  - model_name: qwen3.8-max-fast
    litellm_params:
      model: openai/qwen3.8-max
      api_base: https://token-plan.maas.qwencloudapi.com/compatible-mode/v1
      api_key: os.environ/QWEN_PLAN_API_KEY
      enable_thinking: false
      input_cost_per_token: 2.0e-06
      output_cost_per_token: 6.0e-06
      cache_read_input_token_cost: 1.7e-07
      cache_creation_input_token_cost: 2.5e-06

  # ===== DEEPSEEK (chat, rotas opcionais — fora do RAG) =====
  # S55 (2026-10-14): de 1 grupo legado para 4 — flash + pro, cada um com thinking
  # ON e OFF. NAO entram em rag-chat nem no fluxo RAG/embeddings (invariante 7).
  # Uso: pontual do agente (ex.: dumps grandes de engenharia reversa) e bench H5b
  # multi-modelo. Chave em DEEPSEEK_API_KEY (.env, conta separada do Qwen — creditos
  # do Token Plan NAO valem aqui). Sem a chave, os 4 grupos falham-closed na porta e
  # nao afetam nenhum outro modelo (docker-compose.yml: ${DEEPSEEK_API_KEY:-}).
  #
  # IDs UPSTREAM ATUAIS — confirmados em GET /v1/models ao vivo + docs oficiais
  # (Models & Pricing, 2026-10-14):
  #   deepseek-flash   = DeepSeek-V4.1-Flash  | ctx 1M (1.048.576) | out max 393.216 | visao OK
  #   deepseek-v4-pro  = DeepSeek-V4-Pro-0813 | ctx 1M (1.048.576) | out max 393.216 | SEM visao
  #   deepseek-chat / deepseek-reasoner = aliases LEGADOS em aposentacao (ainda
  #   aceitos, porem servidos e cobrados como Flash). NAO usar. Armadilha medida:
  #   supports_reasoning("deepseek/deepseek-chat") = False => o alias legado nem
  #   habilita o caminho de reasoning no LiteLLM (motivo extra para migrar).
  #
  # THINKING — DIFERE da convencao S44 (extra_body): aqui `thinking` vai TOP-LEVEL
  # no litellm_params dos 4 grupos. Motivo medido no codigo instalado do provedor
  # (llms/deepseek/chat/transformation.py): _thinking_mode_active() so retorna True
  # com optional_params["thinking"]["type"] == "enabled", e somente entao o LiteLLM
  # chama _fill_reasoning_content(), que reinjeta o reasoning_content faltante nas
  # mensagens de assistant. Enterrar thinking dentro de extra_body NAO arma esse shim
  # (sonda: get_optional_params com extra_body => thinking nao aparece no resultado).
  # Consequencia pratica: em loop de agente multi-turno o upstream responde HTTP 400
  # ("The reasoning_content in the thinking mode must be passed back to the API",
  # docs §4.3). Por isso a rota ON declara thinking explicito em vez de herdar o
  # default. Efeito do OFF e identico ao dos -fast historicos.
  # Nota §5.2/§5.3: em thinking ON, temperature/top_p/presence_penalty/
  # frequency_penalty sao inertes (podem ate ser rejeitados) e completion_tokens
  # INCLUI os tokens de raciocinio => saida muito mais cara por tarefa curta.
  #
  # Tarifas = card OFICIAL off-peak (USD/1M ÷ 1e6). DeepSeek NAO cobra surcharge de
  # cache-write (write billa como input-miss), por isso cache_creation == input.
  #   flash: cache-hit $0,003 | input-miss $0,15 | output $0,60
  #   pro:   cache-hit $0,022 | input-miss $0,66 | output $1,98
  # ATENCAO: PEAK = 2x esses valores (01:00-04:00 e 06:00-10:00 UTC, seg-sex;
  # feriado chines conta como off-peak). O preco aqui e flat off-peak, entao em
  # janela de peak o SpendLogs SUB-notifica o custo por 2x (nunca sobre-notifica).
  # Desconto de cache de 98% torna canibalizar zona cacheada AINDA pior que no Qwen
  # (89%) — relevante p/ decisao headroom.
  # Concorrencia upstream: flash 2500 / pro 500 (excesso = erro 3003).
  # Recomendacao: usar as rotas -fast em modos de agente com tools; reservar as
  # rotas ON para chamada unica sem loop de ferramentas.
  - model_name: deepseek-flash
    litellm_params:
      model: deepseek/deepseek-flash
      api_key: os.environ/DEEPSEEK_API_KEY
      thinking:
        type: enabled
      input_cost_per_token: 1.5e-07
      output_cost_per_token: 6.0e-07
      cache_read_input_token_cost: 3.0e-09
      cache_creation_input_token_cost: 1.5e-07
    model_info:
      max_input_tokens: 1048576
  - model_name: deepseek-flash-fast
    litellm_params:
      model: deepseek/deepseek-flash
      api_key: os.environ/DEEPSEEK_API_KEY
      thinking:
        type: disabled
      input_cost_per_token: 1.5e-07
      output_cost_per_token: 6.0e-07
      cache_read_input_token_cost: 3.0e-09
      cache_creation_input_token_cost: 1.5e-07
    model_info:
      max_input_tokens: 1048576
  - model_name: deepseek-v4-pro
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_API_KEY
      thinking:
        type: enabled
      input_cost_per_token: 6.6e-07
      output_cost_per_token: 1.98e-06
      cache_read_input_token_cost: 2.2e-08
      cache_creation_input_token_cost: 6.6e-07
    model_info:
      max_input_tokens: 1048576
  - model_name: deepseek-v4-pro-fast
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_API_KEY
      thinking:
        type: disabled
      input_cost_per_token: 6.6e-07
      output_cost_per_token: 1.98e-06
      cache_read_input_token_cost: 2.2e-08
      cache_creation_input_token_cost: 6.6e-07
    model_info:
      max_input_tokens: 1048576

  # ===== NOVAI GATEWAY (chat, rota opcional — fora do RAG) =====
  # NAO entra em rag-chat nem no fluxo RAG/embeddings. Gateway OpenAI-compativel
  # (Hong Kong) que agrega 121+ modelos chineses a preco de lista sem markup.
  # Base URL = https://aiapi-pro.com/v1 ; chave tem prefixo "nvai-" (NAO sk-) e fica
  # em NOVAI_API_KEY (.env, conta/balance separada — creditos Qwen/DeepSeek NAO valem
  # aqui). Sem a chave definida, o grupo novai-* falha-closed na porta e nao afeta
  # nenhum outro modelo (ver docker-compose.yml, ${NOVAI_API_KEY:-}). Padrao = rota
  # deepseek-* acima.
  #
  # ---- S40 (2026-10-14, decisao do usuario): SO GLM-4.7-flash "por enquanto" ----
  # Os outros 8 grupos criados na adesao (S39) foram REMOVIDOS: os pagos
  # glm-5.3-flash / deepseek-v4-flash / qwen3.8-max / kimi-k2.5 / doubao-seed-2.0-pro,
  # os free glm-4.6v-flash / glm-4.1v-thinking-flash, e o alias
  # novai-glm-4.7-flash-nothink (mesmo upstream, thinking OFF via extra_body — removido
  # por escolha explicita do usuario). Nao e retrabalho: os blocos estao no historico
  # git e re-adicionar e item NOVO de backlog, nao correcao.
  # Por que a reducao e segura: os pagos nao tinham uso ativo; menos grupos = menos superficie de
  # falha e menos ruido no seletor de modelos do cliente. (A premissa ORIGINAL da S40 era "a cota
  # free e minúscula"; CORREGIDA na S56 abaixo — a decisao de manter so glm-4.7-flash permanece,
  # pois era tambem escolha explicita de escopo do usuario.)
  # ---- RATE/QUOTA (CORREGIDO S56, 2026-10-14, autoridade = usuario sobre a propria conta) ----
  # A CONTA NovAI deste stack opera em MODO STANDARD: 60 rpm e COTA UNLIMITED. O teto de
  # 10 chamadas/DIA POR MODELO + 5 req/min (medido 2026-10-14 via 429 "daily limit of 10 free-model")
  # e do MODO FREE-TIER, que NAO e o estado corrente desta conta — entao NAO racionar uso da rota.
  # glm-4.7-flash continua free-forever: PRECO do MODELO 0 (propriedade do modelo, independe do modo
  # da conta), NAO consome saldo (erro 402 nao se aplica).
  # Tarifas = card oficial do marketplace (USD por token = USD/1M / 1e6). NovAI cobra
  # so input/output (sem surcharge de cache exposto), entao cache_read/cache_creation
  # ficam de fora de proposito — LiteLLM nao inventa desconto.
  # Throttle global da familia ZhiPu ("该模型当前访问量过大") ~10 min aparece na
  # SpendLogs como InternalServerError, NAO RateLimit; falhas nao consomem cota.
  # Regra operacional: backoff de minutos — nao trocar de modelo free ZhiPu (o
  # congestionamento e compartilhado). Modelos upstream = slug exato do marketplace
  # (GET /v1/models confirma, 121 modelos). CogView-3-Flash / CogVideoX-Flash (tambem
  # free) SAO FORA daqui: endpoints de imagem/video (/v1/images, /v1/video), nao chat
  # — escopo desta rota e chat-only.
  # ---- S42 (2026-10-14, decisao do usuario): rota REVERTIDA 4.1v-thinking -> 4.7-flash ----
  # A troca S41 (workaround) existiu so porque o gateway quebrava streaming em glm-4.7-flash
  # (HTTP 500) e o Copilot exige stream:true. O suporte NovAI corrigiu o serializador SSE deles
  # (3o e-mail 2026-10-14) e a re-medida provou: framing agora conforme ('}\n\ndata:' em todos
  # os eventos, proxy LiteLLM parseia limpo, 55 eventos / 0 invalidos). Medido TAMBEM em
  # glm-4.1v-thinking-flash — ambos streamam. Preferencia declarada do usuario (S40) =
  # glm-4.7-flash: texto puro, mais leve/rapido que o 4.1v (vision+reasoning, mais pesado).
  # max_input_tokens volta a 202000 (valor TRAVADO do 4.7, validado via /v1/model/info na S39).
  # ---- S43 (2026-10-14): thinking OFF via extra_body ---- S44 (2026-10-14): DUAS rotas, ON e OFF ----
  # S43 desligou o thinking na rota unica (sem extra_body o grupo herdava thinking ON do upstream —
  # smoke S40: reasoning_tokens=138/143, ~96% da saida virava raciocinio). S44 (pedido do usuario
  # "tenha os 2") revoga parcialmente a S43 e passa a expor AS DUAS variantes lado a lado, seguindo a
  # convengao do repo (mesma dos Qwen no chatLanguageModels.json): id BASE = thinking ON, sufixo
  # "-fast" = thinking OFF.
  #   novai-glm-4.7-flash       -> thinking ON  (SEM extra_body; herda default do upstream, PROVADO
  #                                S40 reasoning 138/143). Display "GLM-4.7 Flash (NovAI free thinking)".
  #   novai-glm-4.7-flash-fast  -> thinking OFF (extra_body thinking:{type:disabled}, PROVADO S43
  #                                reasoning 0; flag oficial ZhiPu, upstream direto na S39). Display
  #                                "GLM-4.7 Flash (NovAI free fast)".
  # Ambos apontam p/ MESMO upstream openai/glm-4.7-flash (compartilham rate/quota da conta). S44 foi
  # ESCOLHA de comportamento (ON + OFF lado a lado), NAO dobrava capacidade. Sob modo STANDARD (S56)
  # a cota e unlimited, entao as duas rotas nao competem por um teto apertado. Precedente:
  # S39 ja teve base + alias nothink no mesmo upstream sem conflito. extra_body e _SDK_OPTION_KEY
  # mesclado no corpo (openai.py:340/353) => NAO dropado por drop_params:true. max_input 202000 (S39).
  - model_name: novai-glm-4.7-flash
    litellm_params:
      model: openai/glm-4.7-flash
      api_base: https://aiapi-pro.com/v1
      api_key: os.environ/NOVAI_API_KEY
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
    model_info:
      max_input_tokens: 202000
  - model_name: novai-glm-4.7-flash-fast
    litellm_params:
      model: openai/glm-4.7-flash
      api_base: https://aiapi-pro.com/v1
      api_key: os.environ/NOVAI_API_KEY
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
      extra_body:
        thinking:
          type: disabled
    model_info:
      max_input_tokens: 202000
  # ---- S46 (2026-10-14, decisao do usuario): doubao-seed-2.0-pro (PAGO) — thinking ON + fast OFF ----
  # Pedido: "adicione esse modelo pelo NovAI, nao e free, coloque o fast e thinking". Re-adesao do
  # modelo removido na S40 — item NOVO de backlog, nao retrabalho (blocos antigos no historico git).
  # Tarifas OFICIAIS (card marketplace + pagina do modelo): $0,40 in / $2,00 out por 1M tokens =>
  # input_cost 4.0e-07 / output_cost 2.0e-06. PAGO com saldo da conta NovAI (min recarga $5 USDT
  # TRC20); NAO e free-forever como o glm (cobra por token); 402 possivel se saldo zerado.
  # (conta em modo standard / cota unlimited — S56; o teto de cobranca aqui e SALDO, nao rpm/cota.)
  # owned_by=bytedance no catalogo
  # (id unico "doubao-seed-2.0-pro"; "-fast" e convencao NOSSA, nao existe upstream).
  # Thinking MEDIDO nesta sessao (n=1, direto no gateway): default -> reasoning 284/330 = ON por
  # padrão upstream; extra_body thinking:{type:disabled} -> reasoning_tokens=0 = FUNCIONA tambem em
  # ByteDance (estende a regra S44, antes provada so p/ ZhiPu). GOTCHA: enable_thinking:false -> 143,
  # NAO desliga no Doubao (nao e a flag Qwen) — usar SEMPRE thinking:{type:disabled}.
  # Convencao S44 replicada: base = thinking ON (sem extra_body), "-fast" = OFF. Ambos -> MESMO
  # upstream openai/doubao-seed-2.0-pro => mesma cobranca, duas escolhas de comportamento.
  # Contexto: pagina oficial do modelo = 256K in (262.144) / 16K out (compare.html sugere 128K p/
  # familia Lite/Code; pagina dedicada vence). Gateway NAO expoe API de info por modelo (404).
  # Chat-only: NAO entra em rag-chat nem fallbacks (invariante 7, precedente glm/deepseek).
  - model_name: novai-doubao-seed-2.0-pro
    litellm_params:
      model: openai/doubao-seed-2.0-pro
      api_base: https://aiapi-pro.com/v1
      api_key: os.environ/NOVAI_API_KEY
      input_cost_per_token: 4.0e-07
      output_cost_per_token: 2.0e-06
    model_info:
      max_input_tokens: 262144
  - model_name: novai-doubao-seed-2.0-pro-fast
    litellm_params:
      model: openai/doubao-seed-2.0-pro
      api_base: https://aiapi-pro.com/v1
      api_key: os.environ/NOVAI_API_KEY
      input_cost_per_token: 4.0e-07
      output_cost_per_token: 2.0e-06
      extra_body:
        thinking:
          type: disabled
    model_info:
      max_input_tokens: 262144

  # ===== S95 — DeepSeek via NovAI (4 upstreams x thinking ON/OFF) =====
  # Pedido do usuario (2026-10-15): adicionar deepseek-v4.1-flash / deepseek-v4-pro /
  # deepseek-v4-flash / deepseek-v4-flash-vision pelo gateway NovAI, com variantes
  # fast (thinking OFF) e thinking. Convencao S44/S46 replicada: base = thinking ON
  # (herda default upstream), -fast = extra_body thinking:{type:disabled}.
  # MEDIDO nesta sessao (direto no gateway, n=1): default ON em todos os 4
  # (reasoning 49/21/31 tokens; pro e v4-flash reportam em
  # completion_tokens_details.reasoning_tokens); thinking:disabled -> reasoning 0 ou
  # ausente em TODOS (flag funciona p/ DeepSeek via NovAI tambem -- estende regra
  # S44, que era ZhiPu-only + ByteDance S46). Vision confirmado: o slug -vision
  # responde a imagem base64 (cor correta).
  # NAO sombreia as rotas DIRETAS S55 (deepseek-flash/deepseek-v4-pro...): grupos
  # aqui usam prefixo novai-. Chat-only (invariante 7): fora de rag-chat/fallbacks.
  # Custos TRAVADOS S96 (fonte unica: docs/novai-model-marketplace.html -- dump
  # local do marketplace, gitignored via .gitignore:9 '/docs/'; antes chamado
  # model-marketplace.html, renomeado 2026-10-15; tabela oficial NovAI por
  # modelo, preco por 1M tokens): v4.1-flash e v4-flash-vision
  # $0.308/$1.231 (Exclusive); v4-pro $0.57/$1.15; v4-flash $0.08/$0.17.
  # O conflito apontado na S95 era entre NovAI e a DeepSeek OFICIAL (rotas
  # diretas S55), NAO dentro da NovAI -- aqui vale o preco NovAI.
  # Contexto 128K (131072) = mesma tabela; gateway nao expoe API de info por
  # modelo (404, medido S46/S95). Se virar rota principal, re-medir janela real.
  - model_name: novai-deepseek-v4.1-flash
    litellm_params:
      model: openai/deepseek-v4.1-flash
      api_base: https://aiapi-pro.com/v1
      api_key: os.environ/NOVAI_API_KEY
      input_cost_per_token: 3.08e-07
      output_cost_per_token: 1.231e-06
    model_info:
      max_input_tokens: 131072
  - model_name: novai-deepseek-v4.1-flash-fast
    litellm_params:
      model: openai/deepseek-v4.1-flash
      api_base: https://aiapi-pro.com/v1
      api_key: os.environ/NOVAI_API_KEY
      input_cost_per_token: 3.08e-07
