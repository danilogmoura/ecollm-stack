  # ===== EMBEDDINGS =====
  # gemini-embedding-2 = 3072 dims (MRL: aceita 768/1536/3072 via "dimensions";
  # auto-normaliza as dims truncadas — verificado no teste A/B 2026-09-24).
  # Task assimétrica p/ código: prefixo no texto "task: code retrieval | query: ..."
  # Embedding local (bge-m3) REMOVIDO da stack em 2026-09-25: sem fallback de
  # embeddings por design (3072 vs 1024 = espaços incompatíveis corromperiam o índice).
  #
  # GARANTIA (verificado 2026-09-25): o Google e SO o gerador de embeddings desta
  # stack. Os grupos qwen3.8-* sao chat-only — o proprio endpoint do Token Plan
  # retorna 404 em /v1/embeddings (erro do upstream, nao do LiteLLM), e a doc do
  # plano nao lista nenhum modelo de embedding. Um request de embed apontando p/
  # Qwen falha na porta, nao existe caminho silencioso p/ outro gerador. Se um dia
  # houver embedder novo, re-embedar o indice INTEIRO e obrigatorio (espacos
  # vetoriais de modelos diferentes sao incompativeis — nunca misturar no mesmo indice).
  - model_name: rag-embeddings
    litellm_params:
      model: gemini/gemini-embedding-2
      api_key: os.environ/GEMINI_API_KEY

  # ===== PERFIS DE EMBEDDING TROCAVEIS (S32-c, I9) =====
  # DECISAO (invariante 7): perfis de embedding NAO sao fallback. Cada grupo serve
  # um ESPACO VETORIAL proprio (tabela + dim no registry ingest/profiles.py); nunca
  # ha `fallbacks:` entre eles — misturar vetores de modelos diferentes num mesmo
  # indice corrompe a busca (BUG-002/§2 do plano). Trocar de perfil = sync dedicado
  # (`rag-sync --profile X`) que re-embeda o indice INTEIRO naquela tabela; o
  # ponteiro published_profile por repo decide qual espaco atende leitura (S32-b).
  #
  # qwen3.7-text-embedding (MaaS sk-ws-, 1024d, batch<=20): MELHOR candidato global
  # medido (overall r@8 0,949 no dataset-v2). O Token Plan (sk-sp-) NAO serve
  # embeddings (404) — so este endpoint MaaS /compatible-mode/v1. Chave em
  # QWEN_MAAS_API_KEY (.env, NUNCA commitada — ver R5: rotacionar antes de gravar).
  - model_name: rag-embeddings-qwen37
    litellm_params:
      model: openai/qwen3.7-text-embedding
      api_base: https://maas.qwencloudapi.com/compatible-mode/v1
      api_key: os.environ/QWEN_MAAS_API_KEY

  # bge-m3 (Ollama local, 1024d, $0/offline): melhor MRR entre os locais, forte em
  # pt-BR. Perfil de ingest/eval — nao precisa ficar quente (KEEP_ALIVE=15m evicta).
  # api_base usa o NOME DO SERVICO na rede docker ("ollama"), nao localhost (R8).
  - model_name: rag-embeddings-bgem3
    litellm_params:
      model: openai/bge-m3:latest
      api_base: http://ollama:11434/v1
      api_key: ollama

litellm_settings:
  drop_params: true
  # S28 (T-OPS-5): verbose desligado por default. Com set_verbose:true +
  # LITELLM_LOG=DEBUG o proxy despejava o CORPO inteiro de cada request nos logs
  # — incluindo a master key e todo o payload do agente. DEBUG só sob demanda.
  set_verbose: false
  num_retries: 2
  # Cada item: {modelo_chamado: [fallbacks em ordem]}
  # Chat: Gemini -> qwen3:4b local (válido, mesma tarefa).
  # Embeddings: sem fallback por design — não existe embedder local na stack.
  fallbacks:
    - rag-chat: ["qwen3:4b-instruct-2507"]

  # ===== CACHE (Redis já sobe no compose; REDIS_URL aponta p/ ele) =====
  # Habilitado SOMENTE p/ embeddings, e o motivo é um fato medido hoje:
  # SpendLogs 2026-09-25 = 105k prompt-tok vs 6k completion-tok no fluxo de
  # agente. ENTRADA domina o custo. Isso define qual tipo de cache serve:
  #
  #  1. CACHE DE RESPOSTA (este bloco, exato): chave = hash do request INTEIRO;
  #     "qualquer mudança na conversa = miss" (doc proxy/caching). Por isso NÃO
  #     cobrimos chat aqui: loop de agente muda os messages a cada iteração →
  #     hit ~zero, e só adicionaria latência de round-trip ao Redis. Para
  #     embeddings porém o texto do chunk é imutável entre execuções de ingest
  #     → re-tocar o corpus vira hit grátis. Guardamos também contra o caso
  #     "pergunta repetida" do RAG.
  #  2. SEMÂNTICO (redis-semantic): doc avisa que "goes badly wrong on agentic
  #     traffic" — embedding aproximado serviria resposta errada. De fora.
  #  3. PROMPT CACHING de upstream (Anthropic/OpenAI/Gemini breakpoints): corta
#     o token de ENTRADA repetido, que é exatamente nosso gargalo.
#     [REGISTRO HISTÓRICO — AFIRMAÇÃO REFUTADA, preservada por regra do §6:]
#     ~~"exige suporte nativo do provedor, e o Token Plan Qwen NÃO expõe nenhum
#     campo de cache na doc (grep em qwen.txt = zero hits). LiteLLM faz cache
#     pass-through só p/ Anthropic/OpenAI/Gemini, não p/ openai-compat custom."~~
#     ➜ CORREÇÃO (BUG-007, ticket Alibaba 0065ETFBAP + teste empírico via este
#       proxy): o Token Plan Individual SUPORTA context caching no endpoint
#       OpenAI-compatível. O pass-through FOI medido EM ROTA openai-compat custom
#       (sem upgrade): usage já devolve prompt_tokens_details.cached_tokens /
#       cache_creation_input_tokens. Modos explicit/implicit ativos nos modelos
#       qwen3.8-* (implícito hit ~20%; explícito criação 125%/hit menor, TTL 5min,
#       ≤4 markers). A economia real de entrada mora AQUI, não só em headroom.
#       Ver PLANO-RAG.md §4b-5/§4b-6 e .planning/docs/context-cache.md.
#       (O bloco de cache RESPOSTA abaixo continua escopado em aembedding: isso é
#        orthogonal — cache de resposta no proxy ≠ KV/prefixo cache no upstream.)
  #
  # ➜ HEADROOM (próxima camada, quando o RAG nascer): a economia real de entrada
  #   não é cache de resposta — é JANELA. Um pré-processador de contexto
  #   (headroom-style: dedupe de chunks, resumo de histórico antigo, truncar
  #   tool-output) ataca os 105k in-tok direto. Este cache de embeddings fica
  #   barato de manter e serve de base p/ medir hit-rate antes de adicionar
  #   headroom por cima.
  cache: true
  cache_params:
    type: redis # lê conexão de REDIS_URL (env), sem host/port explícitos
    # S74: só `aembedding`. `atranscription` foi REMOVIDO — não há nenhum modelo de
    # áudio/transcrição na stack (config morta). Chat fica FORA de propósito (loop de
    # agente ⇒ hit ~zero, só adds latência Redis).
    supported_call_types: ["aembedding"]
    ttl: 86400 # respostas de embed válidas p/ re-ingest no mesmo dia
